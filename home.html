<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gulf Hotels Group – Web to Lead</title>

<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background-image: url('https://www.gulfhotelsgroup.com/images/homebanner3.jpg');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        backdrop-filter: blur(3px);
    }

    .form-container {
        background: rgba(255, 255, 255, 0.92);
        margin: 50px auto;
        padding: 30px;
        width: 420px;
        border-radius: 12px;
        box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    .logo-container img {
        width: 160px;
        display: block;
        margin: 0 auto 20px auto;
    }

    label {
        font-weight: bold;
        margin-top: 12px;
        display: block;
        color: #7b1f24;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    textarea {
        resize: vertical;
    }

    .rooms-container {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .rooms-container input {
        flex: 1;
    }

    .rooms-container button {
        width: 38px;
        height: 38px;
        border-radius: 6px;
        background-color: #7b1f24;
        color: #fff;
        border: none;
        font-size: 20px;
        cursor: pointer;
    }

    .submit-btn {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background-color: #7b1f24;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
    }

    .submit-btn:hover {
        background-color: #5f181d;
    }
</style>

<script>
    function incrementRooms() {
        let input = document.getElementById("rooms");
        input.value = Number(input.value || 0) + 1;
    }
</script>

</head>
<body>

<div class="form-container">

    <div class="logo-container">
        <img src="https://www.gulfhotelsgroup.com/images/logo.png" alt="Gulf Hotels Group Logo">
    </div>

    <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DKB000001x6RQ" method="POST">

        <input type="hidden" name="oid" value="00DKB000001x6RQ">
        <input type="hidden" name="retURL" value="https://www.gulfhotelsgroup.com/index.php">

        <label>First Name</label>
        <input id="first_name" maxlength="40" name="first_name" type="text" required>

        <label>Last Name</label>
        <input id="last_name" maxlength="80" name="last_name" type="text" required>

        <label>Email</label>
        <input id="email" maxlength="80" name="email" type="email" required>

        <label>Company</label>
        <input id="company" maxlength="40" name="company" type="text">

        <label for="property">Property</label>
        <select id="00NKB00001gQRyn" name="00NKB00001gQRyn">
            <option value="">--Select Property--</option>
            <option value="Gulf Convention Center">Gulf Convention Center</option>
            <option value="Gulf Hotel Bahrain">Gulf Hotel Bahrain</option>
            <option value="Gulf Court Hotel Business Bay">Gulf Court Hotel Business Bay</option>
            <option value="Asdal Gulf Inn Hotel">Asdal Gulf Inn Hotel</option>
        </select>

        <label>Number of Rooms</label>
        <div class="rooms-container">
            <input id="rooms" name="00NKB00001gQRym" type="number" min="0" placeholder="0">
            <button type="button" onclick="incrementRooms()">+</button>
        </div>

        <label>Check-in Date</label>
        <input id="00NKB00001gQRyj" name="00NKB00001gQRyj" type="date">

        <label>Check-out Date</label>
        <input id="00NKB00001gQRyk" name="00NKB00001gQRyk" type="date">

        <label>Notes</label>
        <textarea id="00NKB00001gQRyl" name="00NKB00001gQRyl" rows="4"></textarea>

        <button class="submit-btn" type="submit">Submit</button>
    </form>

</div>

</body>
</html>
