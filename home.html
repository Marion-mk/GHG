<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gulf Hotels Group – Group Booking Request</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary-gold: #c89b3c;
      --deep-navy: #002b4c;
      --soft-cream: #f7f4ec;
      --card-bg: #ffffff;
      --text-main: #333333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.7)),
        url("https://www.gulfhotelsgroup.com/images/slider/banner_ghb.webp");
      background-size: cover;
      background-position: center;
      padding: 24px;
    }

    .booking-card {
      background: var(--card-bg);
      max-width: 520px;
      width: 100%;
      border-radius: 18px;
      padding: 24px 26px 26px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
      border-top: 6px solid var(--primary-gold);
      backdrop-filter: blur(6px);
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .brand-header img {
      height: 42px;
    }

    .brand-header h1 {
      font-size: 1.25rem;
      margin: 0;
      color: var(--deep-navy);
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 0.9rem;
      color: #666666;
    }

    form {
      width: 100%;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: var(--deep-navy);
      font-weight: 600;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #d0d4dd;
      font-size: 0.9rem;
      background: #fdfdfd;
      transition: border 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="number"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary-gold);
      box-shadow: 0 0 0 2px rgba(200, 155, 60, 0.25);
      background: #ffffff;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .inline-two {
      display: flex;
      gap: 10px;
    }

    .inline-two .form-row {
      flex: 1;
    }

    /* Number of Rooms control with + button */
    .rooms-wrapper {
      margin-bottom: 12px;
    }

    .rooms-control {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .rooms-control input[type="number"] {
      flex: 1;
      -moz-appearance: textfield;
    }

    .rooms-control input::-webkit-outer-spin-button,
    .rooms-control input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .rooms-plus-btn {
      border-radius: 8px;
      border: none;
      padding: 0 16px;
      font-size: 1.3rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--deep-navy);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    }

    .rooms-plus-btn:hover {
      background: #01406f;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      transform: translateY(-1px);
    }

    .rooms-plus-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 6px;
    }

    .note-text {
      font-size: 0.75rem;
      color: #777777;
    }

    .submit-btn {
      border-radius: 999px;
      border: none;
      padding: 9px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary-gold);
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      transition: background 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }

    .submit-btn:hover {
      background: #b48325;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    @media (max-width: 600px) {
      .booking-card {
        padding: 18px 16px 20px;
      }

      .brand-header h1 {
        font-size: 1.05rem;
      }

      .footer-row {
        flex-direction: column-reverse;
        align-items: flex-start;
      }

      .submit-btn {
        width: 100%;
        text-align: center;
        justify-content: center;
      }
    }
  </style>
</head>
